services:
  chatwiki_redis_service:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/redis:5.0
    container_name: chatwiki_redis_service
    ports:
      - ${REDIS_PORT}:6379
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ../volumes/redis_data:/data
    networks:
      - chatwiki_network
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}

  chatwiki_crawler:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/playwright:20261105
    container_name: chatwiki_crawler
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
      PRODUCTION: "true"
    volumes:
      - ../:/var/www/crawler/
    working_dir: /var/www/crawler
    command: ./build/crawler
    networks:
      - chatwiki_network
    ports:
      - ${CRAWLER_PORT}:3800

  chatwiki_converter:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/converter:1.7
    privileged: true
    container_name: chatwiki_converter
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    networks:
      - chatwiki_network

  chatwiki_postgres_service:
    container_name: chatwiki_postgres_service
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/postgres:20261012
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../volumes/postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - chatwiki_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1" ]
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 15s

  chatwiki_go_nsq_service:
    build:
      context: .
      dockerfile: DockerfileGoNsq
    container_name: chatwiki_go_nsq_service
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/go_nsq_service:20260506
    working_dir: /var/www/go-nsq
    ports:
      - ${NSQADMIN_PORT}:4171
    networks:
      - chatwiki_network
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    stdin_open: true
    tty: true
    command:
      - /bin/bash
      - -c
      - |
        supervisord
        /bin/bash

  chatwiki_go_push_service:
    build:
      context: .
      dockerfile: DockerfileGoPush
    container_name: chatwiki_go_push_service
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/go_push_service:20251103
    volumes:
      - ../:/var/www/chatwiki/
    working_dir: /var/www/chatwiki
    ports:
      - ${PUSH_SERVICE_PORT}:24529
    networks:
      - chatwiki_network
    restart: always
    depends_on:
      - chatwiki_redis_service
      - chatwiki_postgres_service
      - chatwiki_go_nsq_service
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    stdin_open: true
    tty: true
    command:
      - /bin/bash
      - -c
      - |
        supervisord
        /bin/bash

  chatwiki_go_core_service:
    build:
      context: .
      dockerfile: DockerfileGoCore
    container_name: chatwiki_go_core_service
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/go_core_service:20260730
    volumes:
      - ../:/var/www/chatwiki/
      - ../volumes/nginx_logs:/var/log/nginx/
    working_dir: /var/www/chatwiki
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${CHAT_SERVICE_PORT}:8080
      - ${H5_SERVICE_PORT}:8081
      - ${PC_SERVICE_PORT}:8082
    networks:
      - chatwiki_network
    restart: always
    depends_on:
      chatwiki_redis_service:
        condition: service_started
      chatwiki_postgres_service:
        condition: service_started
      chatwiki_go_nsq_service:
        condition: service_started
      chatwiki_websocket:
        condition: service_started
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
      HTTP_PROXY: ${PROXY:-}
      HTTPS_PROXY: ${PROXY:-}
    stdin_open: true
    tty: true
    command:
      - /bin/bash
      - -c
      - |
        supervisord
        nginx
        /bin/bash

  chatwiki_websocket:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/ubuntu:22.04
    container_name: chatwiki_websocket
    ports:
      - ${WS_SERVICE_PORT}:24628
    networks:
      - chatwiki_network
    volumes:
      - ../:/var/www/chatwiki/
    working_dir: /var/www/chatwiki
    command: ./build/websocket --IsDev=false
    restart: always
    depends_on:
      - chatwiki_go_nsq_service
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}

  chatwiki_code_run:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/code_run_secure:20261030
    container_name: chatwiki_code_run
    networks:
      - chatwiki_network
    volumes:
      - ../build/code_run:/var/www/chatwiki/build/code_run:ro
      - ../internal/app/code_run/logs:/var/www/chatwiki/internal/app/code_run/logs:rw
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /var/www/chatwiki
    command: ./build/code_run --IsDev=false
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    deploy:
      resources:
        limits:
          pids: 128

  chatwiki_gen_thumbnail:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/ubuntu:22.04
    container_name: chatwiki_gen_thumbnail
    networks:
      - chatwiki_network
    volumes:
      - ../:/var/www/chatwiki/
    working_dir: /var/www/chatwiki
    command: ./build/gen_thumbnail --IsDev=false
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
  chatwiki_plugin:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/plugin:1.0
    container_name: chatwiki_plugin
    networks:
      - chatwiki_network
    volumes:
      - ../:/var/www/chatwiki/
    working_dir: /var/www/chatwiki
    command: ./build/plugin --IsDev=false
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    healthcheck:
      disable: true
    logging:
      options:
        mode: non-blocking
        max-size: "50m"
        max-file: "10"

  chatwiki_file_transfer:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/file_transfer:20251223
    container_name: chatwiki_file_transfer
    networks:
      - chatwiki_network
    working_dir: /app
    command: ./file_transfer
    tty: true
    restart: unless-stopped
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
    ports:
      - ${FILE_TRANSFER_SERVICE_PORT}:8080

  chatwiki_wechat_article_crawler:
    privileged: true
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/wechat_article_crawler:0.2
    container_name: chatwiki_wechat_article_crawler
    networks:
      - chatwiki_network
    restart: unless-stopped
    ports:
      - ${WECHAT_ARTICLE_CRAWLER_PORT}:8000
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
      API_TOKEN: ${WECHAT_ARTICLE_CRAWLER_API_TOKEN}
      SOCKS_PROXY_HOST: ${WECHAT_ARTICLE_CRAWLER_SOCKS_PROXY_HOST}
      SOCKS_PROXY_PORT: ${WECHAT_ARTICLE_CRAWLER_SOCKS_PROXY_PORT}
      SOCKS_PROXY_USERNAME: ${WECHAT_ARTICLE_CRAWLER_SOCKS_PROXY_USERNAME}
      SOCKS_PROXY_PASSWORD: ${WECHAT_ARTICLE_CRAWLER_SOCKS_PROXY_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  chatwiki_llm_runner:
    image: registry.cn-hangzhou.aliyuncs.com/chatwiki/llm_runner:20260720
    container_name: chatwiki_llm_runner
    networks:
      - chatwiki_network
    volumes:
      - ../build/llm_runner:/build/llm_runner:ro
      - ../clawbot/skills_public:/workspace/clawbot/skills_public:ro
      - ../clawbot/skills_robot:/workspace/clawbot/skills_robot:ro
      - ../clawbot/skills_system:/workspace/clawbot/skills_system:ro
      - ../clawbot/working_dir:/workspace/clawbot/working_dir:rw
    working_dir: /workspace
    command: /build/llm_runner
    restart: always
    environment:
      GODEBUG: "${CHATWIKI_GODEBUG:-multipathtcp=0}"
      TZ: ${TIMEZONE}
      LLM_RUNNER_COMMAND_TIMEOUT: 1h
      CHATWIKI_APIKEY: ${CHATWIKI_APIKEY:-}
    ports:
      - ${LLM_RUNNER_PORT}:9000
    user: "10001:10001"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
      nproc: 512
      fsize: 104857600
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    deploy:
      resources:
        limits:
          pids: 512
          cpus: '2'
          memory: 4G

networks:
  chatwiki_network:
    driver: bridge
